name: Docker

permissions:
  contents: read

on:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]*'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Determine image version
        id: ver
        run: |
          VER="$(jq -r .version package.json)"
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || ! echo "${GITHUB_REF_NAME}" | grep -qE '^v[0-9]'; then
            VER="${VER}-${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VER}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: stefanwalther/docker-test:${{ steps.ver.outputs.version }}

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image (master -> also latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          VER="${{ steps.ver.outputs.version }}"
          docker tag stefanwalther/docker-test:"${VER}" stefanwalther/docker-test:latest
          docker push stefanwalther/docker-test:"${VER}"
          docker push stefanwalther/docker-test:latest

      - name: Push image (release tag)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          docker push stefanwalther/docker-test:"${{ steps.ver.outputs.version }}"
